name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  checks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      
      - name: Install uv
        run: pip install uv

      - name: Setup uv
        run: make venv
      
      - name: Install dependencies
        run: make install
      
      - name: Format check
        run: make format
      
      - name: Lint
        run: make lint
      
      - name: Type check
        run: make typecheck
      
      - name: Test
        run: make test
